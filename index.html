<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e16"><title>BiznesOS</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0e16;color:#f2f4fa;font:15px system-ui,Segoe UI,sans-serif}header{padding:20px max(20px,calc((100% - 1040px)/2));border-bottom:1px solid #252b3b;font-weight:850;letter-spacing:.5px}header b{color:#a78bfa}.main{max-width:1040px;margin:auto;padding:34px 20px}.hero h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px}.hero p,.muted,small{color:#9aa2b5}.panel{background:#151a27;border:1px solid #2b3244;border-radius:17px;padding:20px;margin-top:18px}.panel h2{font-size:19px;margin:0 0 16px}.form{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}input,select,textarea{background:#0d121d;color:#f3f4f8;border:1px solid #343d52;border-radius:10px;padding:12px;min-width:0}input,select{flex:1}textarea{width:100%;margin-top:10px;resize:vertical}button{background:#8b70f6;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.alt,.ghost{background:#293145;color:#e7e9f2}.ghost{padding:8px 11px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#191f2e;border:1px solid #2b3244;border-radius:13px;padding:15px}.stat b{display:block;font-size:23px}.stat small{display:block;margin-top:4px}.item,.job{background:#101521;border:1px solid #293247;border-radius:12px;padding:13px;margin-top:10px}.item{display:flex;align-items:center;gap:12px}.grow{flex:1}.grow small{display:block;margin-top:4px}.strike{text-decoration:line-through;color:#8b91a2}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#2c2546;color:#cbbcff;border-radius:999px;padding:6px 10px;font-size:12px}.answers{display:grid;gap:10px}.answer{background:#222b3d;text-align:left}.answer.correct{background:#176448}.answer.wrong{background:#783c4b}.script{white-space:pre-wrap;line-height:1.7;background:#0d121d;padding:16px;border-radius:12px;min-height:150px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.foot{max-width:1040px;margin:0 auto;padding:15px 20px 30px;color:#717b91;font-size:12px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.form>*{width:100%;flex:auto}.main{padding-top:24px}}</style></head><body><header>B•BEKIUZ <b>BIZNESOS</b></header><main class="main"><section class="hero"><h1>BiznesOS</h1><p>Mahsulot va buyurtmalarni bitta sodda panelda nazorat qiling.</p></section><section class="stats" id="stats"></section><section class="panel"><h2>Mahsulot qo‘shish</h2><div class="form"><input id="name" placeholder="Mahsulot nomi"><input id="price" type="number" placeholder="Sotuv narxi"><input id="qty" type="number" placeholder="Soni"><button onclick="add()">Saqlash</button></div></section><section class="panel"><h2>Ombor</h2><div id="products"></div></section><section class="panel"><h2>Buyurtma qayd etish</h2><div class="form"><select id="product"></select><input id="amount" type="number" min="1" value="1" placeholder="Miqdor"><button onclick="sell()">Sotuvni yozish</button></div><div id="sales"></div></section></main><footer class="foot">BEKIUZ · BiznesOS · Ma’lumotlar ushbu brauzerda saqlanadi. Demo versiya.</footer><script>let ps=JSON.parse(localStorage.bizProducts||"[]"),ss=JSON.parse(localStorage.bizSales||"[]");function persist(){localStorage.bizProducts=JSON.stringify(ps);localStorage.bizSales=JSON.stringify(ss);render()}function add(){let n=document.getElementById('name').value.trim(),p=+document.getElementById('price').value,q=+document.getElementById('qty').value;if(!n||p<=0||q<0)return alert('Nom, narx va miqdorni to‘g‘ri kiriting.');ps.push({id:Date.now(),n,p,q});document.getElementById('name').value=document.getElementById('price').value=document.getElementById('qty').value='';persist()}function sell(){let id=+product.value,q=+amount.value,x=ps.find(z=>z.id===id);if(!x||q<1||q>x.q)return alert('Mahsulot yoki miqdor noto‘g‘ri.');x.q-=q;ss.unshift({n:x.n,q,total:q*x.p,date:new Date().toLocaleString('uz-UZ')});persist()}function del(id){ps=ps.filter(x=>x.id!==id);persist()}function render(){let revenue=ss.reduce((a,x)=>a+x.total,0);stats.innerHTML='<div class="stat"><b>'+ps.length+'</b><small>Mahsulot</small></div><div class="stat"><b>'+ss.length+'</b><small>Sotuv</small></div><div class="stat"><b>'+revenue.toLocaleString('uz-UZ')+' so‘m</b><small>Jami tushum</small></div>';products.innerHTML=ps.map(x=>'<article class="item"><div class="grow"><b>'+esc(x.n)+'</b><small>'+x.p.toLocaleString('uz-UZ')+' so‘m · Qoldiq: '+x.q+'</small></div><button class="ghost" onclick="del('+x.id+')">O‘chirish</button></article>').join('')||'<p class="muted">Ombor bo‘sh.</p>';product.innerHTML=ps.map(x=>'<option value="'+x.id+'">'+esc(x.n)+' (qoldiq '+x.q+')</option>').join('');sales.innerHTML=ss.slice(0,8).map(x=>'<article class="item"><span>'+esc(x.n)+' × '+x.q+'<small>'+x.date+'</small></span><b>'+x.total.toLocaleString('uz-UZ')+' so‘m</b></article>').join('')||'<p class="muted">Sotuvlar hali yo‘q.</p>'}function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}render();</script></body></html>
